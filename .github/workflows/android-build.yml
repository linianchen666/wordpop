name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed WordPop signing key
        env:
          WORDPOP_ANDROID_KEYSTORE_BASE64: ${{ secrets.WORDPOP_ANDROID_KEYSTORE_BASE64 }}
          WORDPOP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WORDPOP_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$WORDPOP_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo '::error::Configure WORDPOP_ANDROID_KEYSTORE_PASSWORD in repository Actions Secrets.'
            exit 1
          fi
          python3 android/tools/restore-signing-key.py --output "$RUNNER_TEMP/wordpop.p12"
          echo "WORDPOP_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wordpop.p12" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - run: node android/tools/build-assets.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK, run unit tests and lint
        env:
          WORDPOP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WORDPOP_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug testDebugUnitTest lintDebug
      - name: Verify fixed APK signature
        run: |
          python3 android/tools/verify-signing.py --apk android/app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --expected android/signing-certificate.sha256 --output android/app/build/outputs/signing-certificate.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device tests
        env:
          WORDPOP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WORDPOP_ANDROID_KEYSTORE_PASSWORD }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: gradle -p android connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpop-android-test-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/signing-certificate.sha256
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wordpop.p12"
