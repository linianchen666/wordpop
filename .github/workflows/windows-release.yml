name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag to build'
        required: true
      scope:
        description: Platforms changed in this release
        type: choice
        options: [windows, both]
        default: windows
      reuse_release:
        description: Published stable release supplying the unchanged APK (windows scope)
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: wordpop-${{ github.event.inputs.tag || github.ref_name }}-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REUSE_RELEASE: ${{ inputs.reuse_release }}
      WORDPOP_TEST_SCREENSHOT_DIR: artifacts/transparent-popup-previews
    steps:
      - name: Verify stable release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'A stable version tag is required' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve verified Android release from the same source
        if: inputs.scope == 'both'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow android-build.yml --commit $sha --status success --limit 20 --json databaseId,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Android builds' }
          $runId = $null
          foreach ($run in $runs) {
            if ($run.headSha -ne $sha) { continue }
            $result = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.databaseId)/artifacts" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Android artifacts' }
            if ($result.artifacts | Where-Object { $_.name -eq 'wordpop-android-release-apk' -and -not $_.expired }) {
              $runId = $run.databaseId
              break
            }
          }
          if (-not $runId) { throw 'Run the Android APK release variant successfully for this exact source commit first' }
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name wordpop-android-release-apk --dir artifacts/android
          if ($LASTEXITCODE -ne 0) { throw 'Android release download failed' }
          $expected = (Get-Content android/signing-certificate.sha256 -Raw).Trim()
          $actual = (Get-Content artifacts/android/outputs/signing-certificate.sha256 -Raw).Trim()
          if ($actual -ne $expected) { throw 'Android signing certificate mismatch' }
          if (-not (Test-Path artifacts/android/outputs/apk/release/app-release.apk)) { throw 'Missing Android release APK' }
      - name: Reuse the unchanged Android APK
        if: inputs.scope == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:REUSE_RELEASE) { throw 'Specify the previous stable release containing the unchanged APK' }
          $changed = git diff --name-only $env:REUSE_RELEASE HEAD -- android/app/src/main android/tools android/app/build.gradle android/build.gradle android/settings.gradle android/gradle.properties src/shared src/data/wordlists src/main/review-algorithm.js src/main/study-policy.js src/renderer/shared/translations.js
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare source release' }
          if ($changed) { throw "Android inputs changed; select both platforms instead: $changed" }
          $previousLock = git show "$($env:REUSE_RELEASE):package-lock.json" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read original dependency lock' }
          $currentLock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          if (($previousLock.packages.'node_modules/ts-fsrs' | ConvertTo-Json -Compress) -ne ($currentLock.packages.'node_modules/ts-fsrs' | ConvertTo-Json -Compress)) { throw 'Shared FSRS dependency changed; release both platforms' }
          $gradle = Get-Content android/app/build.gradle -Raw
          if ($gradle -notmatch "versionName '([0-9]+\.[0-9]+\.[0-9]+)'") { throw 'Missing Android version' }
          ./tools/reuse-release-asset.ps1 -Tag $env:REUSE_RELEASE -Asset "WordPop.Android.$($Matches[1]).apk" -Destination artifacts/android/outputs/apk/release/app-release.apk
      - name: Install locked dependencies and Electron native addon
        run: npm ci --strict-ssl=true
      - name: Run regression tests on Windows
        run: npm test
      - name: Build Windows x64 NSIS installer
        run: npm run build -- --win --x64 --publish never
      - name: Verify installed icons and retained shortcut upgrades
        shell: pwsh
        run: ./tools/verify-windows-icons.ps1
      - name: Verify packaged first-run wordlists and settings
        shell: pwsh
        run: |
          $env:WORDPOP_TEST_APP_ROOT = (Resolve-Path 'build/win-unpacked/resources/app.asar').Path
          & .\node_modules\.bin\electron.cmd test/fixtures/settings-window.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged settings validation failed' }
      - name: Verify packaged transparent popup and FSRS ratings
        shell: pwsh
        run: |
          $env:WORDPOP_TEST_APP_ROOT = (Resolve-Path 'build/win-unpacked/resources/app.asar').Path
          & .\node_modules\.bin\electron.cmd test/fixtures/review-window.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged review preview validation failed' }
      - name: Verify packaged pending counts and backlog smoothing
        shell: pwsh
        run: |
          $env:WORDPOP_TEST_APP_ROOT = (Resolve-Path 'build/win-unpacked/resources/app.asar').Path
          & .\node_modules\.bin\electron.cmd test/fixtures/backlog-window.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged backlog counter validation failed' }
      - name: Verify packaged independent taskbar pill
        shell: pwsh
        run: |
          $env:WORDPOP_TEST_APP_ROOT = (Resolve-Path 'build/win-unpacked/resources/app.asar').Path
          & .\node_modules\.bin\electron.cmd test/fixtures/ambient-window.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ambient pill validation failed' }
      - name: Verify packaged once-only memory initialization
        shell: pwsh
        run: |
          $env:WORDPOP_TEST_APP_ROOT = (Resolve-Path 'build/win-unpacked/resources/app.asar').Path
          $env:ELECTRON_RUN_AS_NODE = '1'
          & .\node_modules\.bin\electron.cmd test/memory-initialization.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Packaged memory initialization validation failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify packaged legacy database repair and login
        shell: pwsh
        run: |
          $env:WORDPOP_TEST_APP_ROOT = (Resolve-Path 'build/win-unpacked/resources/app.asar').Path
          $env:ELECTRON_RUN_AS_NODE = '1'
          & .\node_modules\.bin\electron.cmd test/database-startup.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Packaged legacy database repair validation failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Prepare installers and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) { throw 'Release version does not match source' }
          $asset = "build/WordPop.Setup.$version.exe"
          Copy-Item "build/WordPop Setup $version.exe" $asset
          $gradle = Get-Content android/app/build.gradle -Raw
          if ($gradle -notmatch "versionName '([0-9]+\.[0-9]+\.[0-9]+)'") { throw 'Android stable version is required' }
          $androidName = "WordPop.Android.$($Matches[1]).apk"
          Copy-Item artifacts/android/outputs/apk/release/app-release.apk "build/$androidName"
          $assets = @($asset, "build/$androidName")
          $checksums = foreach ($file in $assets) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $checksums | Set-Content build/SHA256SUMS.txt -Encoding ascii
      - name: Save verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: wordpop-stable-packages
          path: |
            build/WordPop.Setup.*.exe
            build/WordPop.Android.*.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload and publish verified stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem build/WordPop.Setup.*.exe, build/WordPop.Android.*.apk, build/SHA256SUMS.txt)
          if ($assets.Count -ne 3) { throw 'Expected exactly two installers and their checksums' }
          gh release upload $env:RELEASE_TAG @($assets.FullName) --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect uploaded release' }
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if (-not $release) { throw 'Release draft was not found' }
          foreach ($file in $assets) {
            $asset = $release.assets | Where-Object { $_.name -eq $file.Name }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.state -ne 'uploaded' -or $asset.digest -ne "sha256:$hash") {
              throw "Release asset verification failed: $($file.Name)"
            }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Save transparent popup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transparent-popup-previews
          path: artifacts/transparent-popup-previews/*.png
          if-no-files-found: ignore

  prune-releases:
    needs: release
    uses: ./.github/workflows/release-retention.yml
    permissions:
      contents: write
