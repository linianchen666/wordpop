appId: com.wordpop.app
productName: WordPop
copyright: Copyright 2026 WordPop

directories:
  output: build
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: assets/icon.ico
    to: wordpop-launcher-v2.ico
  - from: src/data/wordlists
    to: wordlists
    filter:
      - "**/*.json"
  - from: src/data/etymology
    to: etymology
    filter:
      - "**/*.json"
  - from: assets/tray-icon.png
    to: .

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  # 正式构建在 Windows CI 执行，写入程序图标和版本信息。
  rfc3161TimeStampServer: ""
  timeStampServer: ""
  signAndEditExecutable: true

nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WordPop
  include: assets/installer.nsh

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
compression: maximum
