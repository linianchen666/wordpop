<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>WordPop Pill</title>
  <!-- 不引入 common.css，它会设置不透明的 body 背景色 -->
  <link rel="stylesheet" href="pill.css">
</head>
<body>
  <div class="pill-container" id="pill-container">
    <div class="pill-content" id="pill-content">
      <span class="pill-word" id="pill-word">--</span>
      <span class="pill-trans" id="pill-trans">--</span>
    </div>
    <div class="pill-actions">
      <button class="pill-btn" id="btn-close" title="隐藏胶囊">×</button>
    </div>
  </div>
  <script src="../shared/utils.js"></script>
  <script src="pill.js"></script>
</body>
</html>
