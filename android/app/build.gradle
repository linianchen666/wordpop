plugins { id 'com.android.application' }
def fixedStore = System.getenv('WORDPOP_ANDROID_KEYSTORE_PATH')
def fixedPassword = System.getenv('WORDPOP_ANDROID_KEYSTORE_PASSWORD')
if (fixedStore && !fixedPassword) {
    throw new GradleException('Missing WORDPOP_ANDROID_KEYSTORE_PASSWORD for fixed signing key')
}
android {
    namespace 'com.wordpop.android'
    compileSdk 35
    testBuildType = project.hasProperty('wordpopReleaseTests') ? 'release' : 'debug'
    defaultConfig {
        applicationId 'com.wordpop.android'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.1.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (fixedStore) {
            wordpop {
                storeFile file(fixedStore)
                storePassword fixedPassword
                keyAlias 'wordpop'
                keyPassword fixedPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            if (fixedStore) signingConfig signingConfigs.wordpop
        }
        release {
            if (fixedStore) signingConfig signingConfigs.wordpop
        }
    }
}
dependencies {
    implementation 'androidx.javascriptengine:javascriptengine:1.0.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
